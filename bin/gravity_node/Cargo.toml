[package]
name = "gravity_node"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true


[features]
# Forward feature to gaptos so `-p gravity_node --features randomness_disabled` works
randomness_disabled = ["gaptos/randomness_disabled"]
default = []

[dependencies]
futures-util = "0.3.30"
clap = { version = "4.5.17", features = ["derive", "env"] }
futures = "0.3.30"
dirs = "5.0.1"
# `taskdump` is required because the SDK builds with `--cfg tokio_unstable`
# (needed by aptos-runtimes), which activates greth's
# `#[cfg(tokio_unstable)] handle_tokio_dump` in reth-node-metrics; that calls
# `Handle::dump()`, gated on `tokio_unstable + feature="taskdump"`. greth never
# enables it (it never sets tokio_unstable standalone), so we enable it here.
tokio = { version = "1.40.0", features = ["taskdump"] }
tokio-stream = "0.1.16"
eyre = "0.6.12"
tracing = "0.1.40"
tempfile = "3.12.0"
jsonrpsee = "0.24"
hex = "0.4.3"
serde_json = "1.0.128"
serde = "^1.0.226"
sha2.workspace = true
bincode = "1.3"
time = "0.3.36"
anyhow = "1.0.87"
greth = { git = "https://github.com/Galxe/gravity-reth", rev = "09097fbab3f0dd1a034f1fa9d5e34d355024f0c0" }
reqwest = "0.12.9"
# Aligned with gravity-reth v2.3.0 (alloy-primitives 1.6.0, alloy-* 2.0.5) so
# gravity_node's own alloy types unify with the ones re-exported through greth.
# Kept as caret (not `=`) to share a single resolved version with greth.
alloy-primitives = { version = "1.6.0", default-features = false, features = ["map-foldhash"] }
alloy-eips = { version = "2.0.5", default-features = false }
alloy-consensus = { version = "2.0.5" }
alloy-genesis = { version = "2.0.5", default-features = false }
alloy-serde = { version = "2.0.5" }
alloy-transport-http = "2.0.5"
alloy-rpc-types-eth = "2.0.5"
async-trait.workspace = true
api.workspace = true
gaptos = { workspace = true, features = ["gcp-secret-manager"] }
block-buffer-manager.workspace = true
proposer-reth-map.workspace = true
build-info.workspace = true
# Force libssl to be statically linked into the binary so it can ship as a
# single self-contained artifact across libssl1.1 (Debian 11) and libssl3
# (Debian 12+) hosts. native-tls (pulled transitively via aptos-vault-client
# and google-cloud-* under gaptos's gcp-secret-manager feature) is the
# consumer; with `vendored`, openssl-sys compiles OpenSSL from source and
# statically links it, removing the runtime libssl.so.* dependency.
# gravity_cli applies the same trick — keep them in sync. Without this,
# `cargo build -p gravity_node` (e.g. via `make gravity_node`) scopes the
# feature resolve to gravity_node only and openssl-sys defaults to dynamic
# system linkage, producing a binary that fails on hosts whose libssl ABI
# differs from the build host.
openssl = { version = "0.10", features = ["vendored"] }
rayon = "1.7.0"
tracing-flame = "0.2"
tracing-timing = "0.6"
tracing-subscriber = "0.3.19"
tikv-jemallocator.workspace = true
tikv-jemalloc-ctl.workspace = true
tikv-jemalloc-sys.workspace = true
pprof = { version = "0.14", features = ["flamegraph", "protobuf-codec"] }
once_cell.workspace = true
bytes.workspace = true
dashmap.workspace = true
bcs.workspace = true

[build-dependencies]
shadow-rs.workspace = true
