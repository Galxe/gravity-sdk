name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing protected version tag. Select this same tag as the workflow ref.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# PR validation and native builds never get publication or OIDC credentials.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

  policy:
    if: github.repository == 'Galxe/gravity-sdk' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    outputs:
      source: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require exact protected tag context
        id: source
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_KIND" = github-hosted
          test "$REF_PROTECTED" = true
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$INPUT_TAG" = "$GITHUB_REF_NAME"
          fi
          python3 -c 'import sys; sys.path.insert(0, "scripts/release"); import release; release.validate_identity(sys.argv[1], sys.argv[2])' "$GITHUB_REF_NAME" "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Mint policy reader identity
        id: policy-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_POLICY_APP_ID }}
          private-key: ${{ secrets.RELEASE_POLICY_APP_PRIVATE_KEY }}
          owner: Galxe
          repositories: gravity-sdk
          permission-administration: read
          permission-environments: read
      - name: Audit live release controls
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
        run: python3 scripts/release/release.py audit-policy
      - name: Refuse existing releases and drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py assert-new --tag "$GITHUB_REF_NAME"

  build:
    needs: [test, policy]
    # Hosted VM is destroyed after the job; no self-hosted state/cache/socket.
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RUSTFLAGS: '--cfg tokio_unstable'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare clean hosted build environment
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_KIND" = github-hosted
          export CARGO_HOME="$RUNNER_TEMP/cargo" RUSTUP_HOME="$RUNNER_TEMP/rustup"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libclang-dev build-essential pkg-config libudev-dev libzstd-dev cmake protobuf-compiler perl
          toolchain=$(python3 -c 'import re; print(re.search(r"channel\s*=\s*\"([^\"]+)\"", open("rust-toolchain.toml").read())[1])')
          rustup toolchain install "$toolchain" --profile minimal
          cat /etc/os-release
          ldd --version | head -1
          rustc --version
          cargo --version
          docker version
      - name: Build locked production binaries
        run: |
          set -euo pipefail
          cargo build --locked --profile quick-release --bin gravity_node --bin gravity_cli
          mkdir -p "$RUNNER_TEMP/release-inputs" docker/gravity_node/bin
          for binary in gravity_node gravity_cli; do
            test -x "target/quick-release/$binary"
            cp "target/quick-release/$binary" "$RUNNER_TEMP/release-inputs/$binary"
            cp "target/quick-release/$binary" "docker/gravity_node/bin/$binary"
            ldd "target/quick-release/$binary"
          done
          python3 scripts/release/release.py check-abi --directory "$RUNNER_TEMP/release-inputs"
      - name: Package and smoke-test image in isolated build VM
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --target runtime-host-binary -t gravity_node:release-input -f docker/gravity_node/Dockerfile .
          docker run --rm --entrypoint /usr/local/bin/gravity_cli gravity_node:release-input --version
          docker run --rm --entrypoint /usr/bin/curl gravity_node:release-input --version
          docker save gravity_node:release-input -o "$RUNNER_TEMP/release-inputs/image.tar"
      - name: Transfer this run's exact build outputs
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-inputs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [policy, build]
    runs-on: ubuntu-22.04
    # Platform must require an independent reviewer, no admin bypass, v* tags only.
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-inputs
      - name: Require the same reviewed source
        env:
          SOURCE: ${{ needs.policy.outputs.source }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_KIND" = github-hosted
          test "$SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$RUNNER_TEMP/release-inputs/gravity_node" "$RUNNER_TEMP/release-inputs/gravity_cli" "$RUNNER_TEMP/release-assets/"
      - name: Mint short-lived policy reader for final check
        id: policy-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_POLICY_APP_ID }}
          private-key: ${{ secrets.RELEASE_POLICY_APP_PRIVATE_KEY }}
          owner: Galxe
          repositories: gravity-sdk
          permission-administration: read
          permission-environments: read
      - name: Recheck policy after environment review
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
        run: python3 scripts/release/release.py audit-policy
      - name: Publish OCI content under a unique run reference
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/release-docker-auth
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/release-inputs/image.tar"
          image="ghcr.io/galxe/gravity_node:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag gravity_node:release-input "$image"
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          digest="${digest##*@}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          python3 scripts/release/release.py manifest --directory "$RUNNER_TEMP/release-assets" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --image-digest "$digest" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Attest production binaries
        id: binaries
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/gravity_node
            ${{ runner.temp }}/release-assets/gravity_cli
      - name: Attest OCI digest
        id: image-proof
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-docker-auth
        with:
          subject-name: ghcr.io/galxe/gravity_node
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest release manifest
        id: manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/release-assets/release-manifest.json
      - name: Verify proofs and full draft asset bytes, then publish immutable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/release-docker-auth
          BINARY_BUNDLE: ${{ steps.binaries.outputs.bundle-path }}
          IMAGE_BUNDLE: ${{ steps.image-proof.outputs.bundle-path }}
          MANIFEST_BUNDLE: ${{ steps.manifest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BINARY_BUNDLE" "$RUNNER_TEMP/release-assets/binary-provenance.jsonl"
          cp "$IMAGE_BUNDLE" "$RUNNER_TEMP/release-assets/image-provenance.jsonl"
          cp "$MANIFEST_BUNDLE" "$RUNNER_TEMP/release-assets/manifest-provenance.jsonl"
          python3 scripts/release/release.py publish --directory "$RUNNER_TEMP/release-assets" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - name: Remove registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/release-docker-auth
        run: docker logout ghcr.io
