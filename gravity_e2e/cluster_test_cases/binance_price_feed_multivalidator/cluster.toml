# Four-validator live Binance price-feed integration test.
# Keep fixed listeners below Linux's default ephemeral source-port range.

[cluster]
name = "gravity-devnet-binance-price-feed-multivalidator"
base_dir = "/tmp/gravity-cluster-binance-price-feed-multivalidator"

[genesis_source]
genesis_path = "./artifacts/genesis.json"
waypoint_path = "./artifacts/waypoint.txt"

[[nodes]]
id = "node1"
role = "genesis"
source = { project_path = "../" }
host = "127.0.0.1"
validator_port = 26080
vfn_port = 26090
rpc_port = 26100
api_port = 26110
metrics_port = 26120
inspection_port = 26130
https_port = 26140
