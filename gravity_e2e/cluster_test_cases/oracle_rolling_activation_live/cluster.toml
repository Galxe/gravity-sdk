# Four-validator rolling Oracle activation proof.
# Fixed listeners stay below Linux's default ephemeral source-port range.

[cluster]
name = "gravity-devnet-oracle-rolling-activation-live"
base_dir = "/tmp/gravity-cluster-oracle-rolling-activation-live"

[genesis_source]
